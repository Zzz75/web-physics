<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 02 - Vector Basics</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="canvas-stage" aria-labelledby="demo-title">
      <div class="stage-header">
        <div>
          <p class="eyebrow">Stage 00 / Day 02</p>
          <h1 id="demo-title">Vector Basics</h1>
        </div>
        <div class="status-line" aria-live="polite">
          <span id="dprText">DPR 1</span>
          <span id="sizeText">0 x 0</span>
        </div>
      </div>

      <canvas id="vectorCanvas" aria-label="Vector visualizer"></canvas>
    </section>

    <aside class="debug-panel" aria-label="Vector debug values">
      <section>
        <h2>Mouse Vector</h2>
        <dl class="value-list">
          <div>
            <dt>Position</dt>
            <dd id="mouseVectorText">-</dd>
          </div>
          <div>
            <dt>Length</dt>
            <dd id="lengthText">-</dd>
          </div>
          <div>
            <dt>Unit</dt>
            <dd id="unitText">-</dd>
          </div>
        </dl>
      </section>

      <section>
        <h2>Dot Product</h2>
        <dl class="value-list">
          <div>
            <dt>Fixed</dt>
            <dd id="fixedVectorText">-</dd>
          </div>
          <div>
            <dt>Dot</dt>
            <dd id="dotText">-</dd>
          </div>
          <div>
            <dt>Angle</dt>
            <dd id="angleText">-</dd>
          </div>
        </dl>
      </section>

      <section>
        <h2>Layers</h2>
        <label class="toggle-row">
          <input id="unitToggle" type="checkbox" checked>
          <span>Unit vector</span>
        </label>
        <label class="toggle-row">
          <input id="projectionToggle" type="checkbox" checked>
          <span>Projection</span>
        </label>
      </section>
    </aside>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
