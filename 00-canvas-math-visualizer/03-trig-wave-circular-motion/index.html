<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 03 - Trig Wave and Circular Motion</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="canvas-stage" aria-labelledby="demo-title">
      <div class="stage-header">
        <div>
          <p class="eyebrow">Stage 00 / Day 03</p>
          <h1 id="demo-title">Trig Wave and Circular Motion</h1>
        </div>
        <div class="status-line" aria-live="polite">
          <span id="dprText">DPR 1</span>
          <span id="sizeText">0 x 0</span>
        </div>
      </div>

      <canvas id="waveCanvas" aria-label="Sine wave and circular motion visualizer"></canvas>
    </section>

    <aside class="debug-panel" aria-label="Wave controls and debug values">
      <section>
        <h2>Parameters</h2>
        <label class="control-row">
          <span>Amplitude</span>
          <input id="amplitudeInput" type="range" min="20" max="140" step="1" value="80">
          <output id="amplitudeValue">80 px</output>
        </label>
        <label class="control-row">
          <span>Frequency</span>
          <input id="frequencyInput" type="range" min="1" max="6" step="0.25" value="2">
          <output id="frequencyValue">2.00 cycles</output>
        </label>
        <label class="control-row">
          <span>Phase</span>
          <input id="phaseInput" type="range" min="0" max="6.283" step="0.01" value="0">
          <output id="phaseValue">0.00 rad</output>
        </label>
        <label class="control-row">
          <span>Speed</span>
          <input id="speedInput" type="range" min="0" max="4" step="0.1" value="1">
          <output id="speedValue">1.0 rad/s</output>
        </label>
      </section>

      <section>
        <h2>Current Values</h2>
        <dl class="value-list">
          <div>
            <dt>Angle</dt>
            <dd id="angleText">0.00 rad / 0 deg</dd>
          </div>
          <div>
            <dt>sin(angle)</dt>
            <dd id="sinText">0.000</dd>
          </div>
          <div>
            <dt>cos(angle)</dt>
            <dd id="cosText">1.000</dd>
          </div>
        </dl>
      </section>

      <section>
        <h2>Layers</h2>
        <label class="toggle-row">
          <input id="circleToggle" type="checkbox" checked>
          <span>Circle guide</span>
        </label>
        <label class="toggle-row">
          <input id="projectionToggle" type="checkbox" checked>
          <span>Projection line</span>
        </label>
        <label class="toggle-row">
          <input id="animateToggle" type="checkbox" checked>
          <span>Animate phase</span>
        </label>
        <button id="resetButton" type="button">Reset phase</button>
      </section>
    </aside>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
